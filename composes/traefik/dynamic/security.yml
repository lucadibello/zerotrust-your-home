http:
  middlewares:
    # Uniform Security Headers applied to every service
    security-headers:
      headers:
        browserXssFilter: true
        contentTypeNosniff: true
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 63072000
        customFrameOptionsValue: "SAMEORIGIN"
        referrerPolicy: "strict-origin-when-cross-origin"
        hostsProxyHeaders:
          - "X-Forwarded-Host"
          - "X-Forwarded-Proto"
        customResponseHeaders:
          X-Robots-Tag: "noindex, nofollow"
          Server: ""
          X-Powered-By: ""

    # Rate Limiting (protects against brute-force, scraping, and DoS while accommodating media streaming & gallery browsing)
    security-ratelimit:
      rateLimit:
        average: 1200
        burst: 600
        period: 1m

    # Connection Concurrency Limiter (prevents Slowloris & resource starvation while allowing parallel media streams/chunks)
    security-inflight:
      inFlightReq:
        amount: 200

tls:
  options:
    default:
      minVersion: VersionTLS12
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
      curvePreferences:
        - CurveP521
        - CurveP384
        - CurveP256
      sniStrict: true
