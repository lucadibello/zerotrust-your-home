version: "3.3"

networks:
  mc-network:

volumes:
  mcdata:

services:
  mc:
    image: itzg/minecraft-server
    container_name: mc
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
    environment:
      - EULA=true
      - OVERRIDE_SERVER_PROPERTIES=true
      - ANNOUNCE_PLAYER_ACHIEVEMENTS=true
      - ONLINE_MODE=false
    restart: always
    networks:
      - mc-network
    volumes:
      - mcdata:/data
    depends_on:
      - tcptunnel

  tcptunnel:
    container_name: mc-tcp-tunnel
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    environment:
      - TUNNEL_TOKEN=${MC_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run --url tcp://mc:25565
    networks:
      - mc-network
