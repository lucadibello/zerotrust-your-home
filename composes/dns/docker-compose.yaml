services:
  bind9:
    container_name: bind9
    image: ubuntu/bind9:latest
    environment:
      - BIND9_USER=root
      - TZ=Europe/Zurich
    ports:
      - "${IP_ADDRESS}:53:53/tcp"
      - "${IP_ADDRESS}:53:53/udp"
    volumes:
      - ./config:/etc/bind/
      - ./cache:/var/cache/bind
      - ./records:/var/lib/bind
    restart: always
    networks:
      - dns-network

networks:
  dns-network:
    external: true
