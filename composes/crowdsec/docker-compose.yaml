services:
  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    restart: unless-stopped
    environment:
      - COLLECTIONS=crowdsecurity/traefik crowdsecurity/sshd crowdsecurity/http-cve crowdsecurity/whitelist-good-actors crowdsecurity/linux crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules
      - BOUNCER_KEY_traefik=${CROWDSEC_BOUNCER_KEY}
      - TZ=Europe/Zurich
    volumes:
      - ./composes/crowdsec/config/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - ./composes/crowdsec/data:/var/lib/crowdsec/data
      - ./composes/traefik/logs:/var/log/traefik:ro
      - /var/log/auth.log:/var/log/auth.log:ro
      - /var/log/syslog:/var/log/syslog:ro
    expose:
      - "8080"
      - "7422"
      - "6060"
    dns:
      - ${PRIMARY_DNS:-192.168.0.253}
      - ${SECONDARY_DNS:-1.1.1.1}
    networks:
      - traefik-network
    labels:
      - "traefik.enable=false"
    healthcheck:
      test: ["CMD", "cscli", "lapi", "status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  traefik-network:
    external: true

