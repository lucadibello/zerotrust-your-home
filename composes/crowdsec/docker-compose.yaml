services:
  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    restart: unless-stopped
    environment:
      - COLLECTIONS=crowdsecurity/traefik crowdsecurity/sshd crowdsecurity/http-cve crowdsecurity/whitelist-good-actors crowdsecurity/linux
      - TZ=Europe/Zurich
    volumes:
      - ./composes/crowdsec/config/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - ./composes/crowdsec/data:/var/lib/crowdsec/data
      - ./composes/traefik/logs:/var/log/traefik:ro
      - /var/log/auth.log:/var/log/auth.log:ro
      - /var/log/syslog:/var/log/syslog:ro
    dns:
      - ${PRIMARY_DNS:-192.168.0.253}
      - ${SECONDARY_DNS:-1.1.1.1}
    networks:
      - traefik-network
    labels:
      - "traefik.enable=false"

networks:
  traefik-network:
    external: true
