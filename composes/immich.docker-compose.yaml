# Source: https://github.com/immich-app/immich/blob/main/docker-compose.yml
services:
    immich-server:
        container_name: immich_server
        image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
        # extends:
        #   file: hwaccel.transcoding.yml
        #   service: cpu # set to one of [nvenc, quicksync, rkmpp, vaapi, vaapi-wsl] for accelerated transcoding
        volumes:
            # Do not edit the next line. If you want to change the media storage location on your system, edit the value of UPLOAD_LOCATION in the .env file
            - ${IMMICH_UPLOAD_LOCATION}:/usr/src/app/upload
            - /etc/localtime:/etc/localtime:ro
        environment:
            - DB_HOSTNAME=database
            - DB_PORT=5432
            - DB_USERNAME=${IMMICH_DB_USERNAME}
            - DB_PASSWORD=${IMMICH_DB_PASSWORD}
            - DB_DATABASE_NAME=${IMMICH_DB_DATABASE_NAME}
        depends_on:
            - redis
            - database
        restart: always
        healthcheck:
            disable: false
        networks:
            - immich-network
            - traefik-network
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.immich.rule=Host(`photos.${DNS_DOMAIN}`)"
            - "traefik.http.routers.immich.entrypoints=websecure"
            - "traefik.http.routers.immich.tls.certresolver=letsencrypt"
            - "traefik.http.routers.immich.middlewares=strip"
            - "traefik.http.services.immich.loadbalancer.server.port=2283"
            - "traefik.docker.network=traefik-network"

    immich-machine-learning:
        container_name: immich_machine_learning
        # For hardware acceleration, add one of -[armnn, cuda, rocm, openvino, rknn] to the image tag.
        # Example tag: ${IMMICH_VERSION:-release}-cuda
        image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
        # extends: # uncomment this section for hardware acceleration - see https://immich.app/docs/features/ml-hardware-acceleration
        #   file: hwaccel.ml.yml
        #   service: cpu # set to one of [armnn, cuda, rocm, openvino, openvino-wsl, rknn] for accelerated inference - use the `-wsl` version for WSL2 where applicable
        volumes:
            - immich-model-cache:/cache
        networks:
            - immich-network
        restart: always
        healthcheck:
            disable: false

    redis:
        container_name: immich_redis
        image: docker.io/valkey/valkey:8-bookworm@sha256:42cba146593a5ea9a622002c1b7cba5da7be248650cbb64ecb9c6c33d29794b1
        healthcheck:
            test: redis-cli ping || exit 1
        networks:
            - immich-network
        restart: always

    database:
        container_name: immich_postgres
        image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
        environment:
            POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
            POSTGRES_USER: ${IMMICH_DB_USERNAME}
            POSTGRES_DB: ${IMMICH_DB_DATABASE_NAME}
            POSTGRES_INITDB_ARGS: "--data-checksums"
        volumes:
            - ${IMMICH_DB_DATA_LOCATION:-immich_db_data}:/var/lib/postgresql/data
        networks:
            - immich-network
        command: >-
            postgres -c shared_preload_libraries=vectors.so -c 'search_path="$$user", public, vectors' -c logging_collector=on -c max_wal_size=2GB -c shared_buffers=512MB -c wal_compression=on
        shm_size: 128mb
        restart: always

networks:
    traefik-network:
        external: true
    immich-network:

volumes:
    immich_db_data:
        name: ${IMMICH_DB_DATA_LOCATION:-immich_db_data}
    immich_pgdata:
    immich-model-cache:
