services:
  # Main Restic service for Backup/Restore/Prune/Check
  # Uses instrumentisto/restic and sleeps indefinitely to allow 'exec' commands
  backup:
    image: instrumentisto/restic:latest
    hostname: docker
    container_name: restic-backup
    restart: unless-stopped
    # Infinite loop to keep container running for 'exec' commands
    entrypoint: /bin/sh -c 'while true; do sleep 3600; done'
    environment:
      RUN_ON_STARTUP: "true" # Backup on startup
      BACKUP_CRON: "0 0 * * *" # Backup every day at 00:00
      
      # Restic repository configuration
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD}
      
      # Timezone
      TZ: Europe/Zurich
      
      # Additional environment variables for specific backends (e.g. Rclone)
      # Pass them through from host .env
      RCLONE_CONFIG_PASS: ${RCLONE_CONFIG_PASS}

      # Database dump settings (for pre-backup export)
      ENABLE_IMMICH: ${ENABLE_IMMICH:-false}
      IMMICH_DB_USERNAME: ${IMMICH_DB_USERNAME:-postgres}
      IMMICH_DB_DATABASE_NAME: ${IMMICH_DB_DATABASE_NAME:-immich}

      # Pre-backup commands: clean volumes + dump databases
      PRE_COMMANDS: |-
        docker volume prune -f
        echo "[*] Dumping databases before backup..."
        mkdir -p /mnt/backup/project/backups/db-dumps
        if [ "$ENABLE_IMMICH" = "true" ] && docker ps -q -f name=immich_postgres | grep -q .; then
          echo "[*] Dumping Immich database..."
          docker exec -t immich_postgres pg_dump -c -U "$IMMICH_DB_USERNAME" "$IMMICH_DB_DATABASE_NAME" | gzip > /mnt/backup/project/backups/db-dumps/immich_db_dump.sql.gz
          echo "[OK] Immich database dumped."
        fi
        echo "[OK] Pre-backup tasks completed."

      # Notification scripts
      POST_COMMANDS_SUCCESS: |-
        curl -q -X POST -H 'Content-Type: application/json' -d "{\"chat_id\": \"${TELEGRAM_CHAT_ID}\",\"text\": \"✅ Docker volumes backup completed successfully!\"}" https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage
      POST_COMMANDS_FAILURE: |-
        curl -q -X POST -H 'Content-Type: application/json' -d "{\"chat_id\": \"${TELEGRAM_CHAT_ID}\",\"text\": \"❌ An error occurred during Docker volumes backup! Check Restic logs for more details.\"}" https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage
      POST_COMMANDS_INCOMPLETE: |-
        curl -q -X POST -H 'Content-Type: application/json' -d "{\"chat_id\": \"${TELEGRAM_CHAT_ID}\",\"text\": \"⚠️ The docker volumes backup was not completed successfully! Check Restic logs for more details.\"}" https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage
    volumes:
      # Rclone configuration (Read-Write to allow token refreshes)
      - ../config/rclone:/root/.config/rclone
      
      # Backup sources
      - /var/lib/docker/volumes:/mnt/backup/docker:ro
      - ./:/mnt/backup/project:ro
      # Optional data directories (mapped even if empty/unused, but must exist on host or be handled)
      # We map them directly. If they don't exist on host, Docker might create them as root owned dirs.
      # Users should ensure variables are set correctly in .env
      - ${NEXTCLOUD_DATADIR}:/mnt/backup/nextcloud:ro
      - ${IMMICH_UPLOAD_LOCATION}:/mnt/backup/immich:ro
      - ${IMMICH_BACKUP_LOCATION}:/mnt/backup/immich-go:ro
      - ${LOCAL_BACKUP_DIR}:/repos/local
      
      # Docker socket (legacy, might not be needed for instrumentisto/restic but keeping for compatibility if we add scripts)
      - /var/run/docker.sock:/var/run/docker.sock
