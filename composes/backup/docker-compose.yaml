services:
  backup:
    image: mazzolino/restic:latest
    container_name: restic-backup
    restart: unless-stopped
    dns:
      - ${PRIMARY_DNS:-192.168.0.253}
      - ${SECONDARY_DNS:-1.1.1.1}
    networks:
      - traefik-network
    environment:
      TZ: Europe/Zurich
      RUN_ON_STARTUP: "false"
      BACKUP_CRON: "0 0 * * *"
      PRUNE_CRON: "0 3 * * 0"

      # Native Restic variables targeting the Local disk repository
      RESTIC_REPOSITORY: /repos/local/restic
      RESTIC_PASSWORD: ${RESTIC_PASSWORD}
      RESTIC_BACKUP_SOURCES: /mnt/backup
      RESTIC_BACKUP_ARGS: "--exclude='*.tmp' --exclude-file=/tmp/excludes.txt"
      RESTIC_FORGET_ARGS: ${RESTIC_FORGET_ARGS:---keep-last 3 --keep-daily 3 --keep-weekly 2 --keep-monthly 1}

      # The cloud repo to copy to post-backup
      CLOUD_RESTIC_REPOSITORY: ${RESTIC_REPOSITORY}

      # Pass through environment variables for handlers
      ENABLE_IMMICH: ${ENABLE_IMMICH:-false}
      IMMICH_DB_USERNAME: ${IMMICH_DB_USERNAME:-postgres}
      IMMICH_DB_DATABASE_NAME: ${IMMICH_DB_DATABASE_NAME:-immich}
      IMMICH_API_KEY: ${IMMICH_API_KEY:-}
      ENABLE_NEXTCLOUD: ${ENABLE_NEXTCLOUD:-false}
      ENABLE_VAULTWARDEN: ${ENABLE_VAULTWARDEN:-false}
      ENABLE_HOME_AUTOMATION: ${ENABLE_HOME_AUTOMATION:-false}

      NTFY_URL: ${NTFY_URL:-https://ntfy.home.lucadibello.ch}
      NTFY_TOPIC: ${NTFY_TOPIC:-lucadibello-homelab-status}

      # Hooks execute the orchestrated phases from the repository
      PRE_COMMANDS: |-
        apk add --no-cache bash curl gzip
        bash /mnt/backup/project/scripts/backups/container-pre-backup.sh
      POST_COMMANDS_SUCCESS: |-
        bash /mnt/backup/project/scripts/backups/container-post-backup.sh success
      POST_COMMANDS_FAILURE: |-
        bash /mnt/backup/project/scripts/backups/container-post-backup.sh failure
      POST_COMMANDS_INCOMPLETE: |-
        bash /mnt/backup/project/scripts/backups/container-post-backup.sh incomplete

    volumes:
      - ./config/rclone:/root/.config/rclone
      - /var/lib/docker/volumes:/mnt/backup/docker:ro
      - ./:/mnt/backup/project:ro
      - ${NEXTCLOUD_DATADIR:-/mnt/nas-data/nextcloud}:/mnt/backup/nextcloud:ro
      - ${IMMICH_UPLOAD_LOCATION:-/mnt/nas-data/immich}:/mnt/backup/immich:ro
      - ${IMMICH_BACKUP_LOCATION:-/mnt/nextcloud-backups/immich}:/mnt/backup/immich-go:ro
      - ${LOCAL_BACKUP_DIR:-/mnt/backups}:/repos/local
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  traefik-network:
    external: true
